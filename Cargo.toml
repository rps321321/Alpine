[package]
name = "alpine-control-plane"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[[bin]]
name = "alpine"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
fs2 = "0.4.3"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "=0.3.45", features = ["formatting", "macros"] }
ureq = { version = "3.4.0", default-features = false, features = ["json"] }
uuid = { version = "1.24.1", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"
