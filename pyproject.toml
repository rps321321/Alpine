[project]
name = "localmodel-lab"
version = "0.1.0"
description = "Reproducible local-model inventory, benchmarking, and profile promotion tools"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
localmodel = "localmodel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["localmodel"]
