name: rename-worker-approval

on:
  push:
    branches:
      - codex/issue-47-host-supervisor

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Rename worker approval proposal method
        run: python scripts/rename_worker_approval.py
      - name: Retire one-shot files
        run: rm scripts/rename_worker_approval.py .github/workflows/rename-worker-approval.yml
      - name: Commit rename
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: name worker approval as effect proposal"
          git push origin HEAD:codex/issue-47-host-supervisor
