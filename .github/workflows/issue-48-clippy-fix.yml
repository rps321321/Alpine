name: apply-issue-48-clippy-fix

on:
  push:
    branches:
      - codex/issue-48-task-journal

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply Clippy-safe field lookup
        run: python scripts/fix_issue_48_manual_contains.py
      - name: Install Rust formatter
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt
      - name: Format desktop Rust
        run: cargo +1.88.0 fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
      - name: Retire one-shot script
        run: rm scripts/fix_issue_48_manual_contains.py
      - name: Commit Clippy fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use slice membership for journal fields"
          git push origin HEAD:codex/issue-48-task-journal
