name: apply-issue-47

on:
  push:
    branches:
      - codex/issue-47-host-supervisor

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install desktop Rust formatter
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt
      - name: Apply host-supervisor cutover
        run: |
          sed -i '/^patch_pi_test()$/d' scripts/apply_issue_47.py
          python scripts/apply_issue_47.py
      - name: Format Rust
        run: cargo +1.88.0 fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
      - name: Retire one-shot migration files
        run: rm scripts/apply_issue_47.py .github/workflows/issue-47-apply.yml
      - name: Commit cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: move task execution behind host supervisor"
          git push origin HEAD:codex/issue-47-host-supervisor
