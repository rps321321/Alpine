name: harden-issue-47

on:
  push:
    branches:
      - codex/issue-47-host-supervisor

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply supervisor hardening
        run: python scripts/harden_issue_47.py
      - name: Format Rust
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
      - name: Retire one-shot files
        run: rm scripts/harden_issue_47.py .github/workflows/harden-issue-47.yml
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make supervisor settlement idempotent"
          git push origin HEAD:codex/issue-47-host-supervisor
