name: apply-issue-48-core

on:
  push:
    branches:
      - codex/issue-48-task-journal

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply Task Journal core cutover
        run: python scripts/apply_issue_48_core.py
      - name: Install Rust formatter
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt
      - name: Format Rust
        run: cargo +1.88.0 fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
      - name: Retire one-shot files
        run: rm scripts/apply_issue_48_core.py .github/workflows/issue-48-core-apply.yml
      - name: Commit core cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: make task journal authoritative"
          git push origin HEAD:codex/issue-48-task-journal
