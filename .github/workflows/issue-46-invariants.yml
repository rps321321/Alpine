name: issue-46-invariants

on:
  push:
    branches:
      - codex/issue-46-execution-aggregate
    paths:
      - .github/workflows/issue-46-invariants.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/issue-46-execution-aggregate
          fetch-depth: 0
      - name: Apply Execution invariant fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          execution_rs = Path("apps/desktop/src-tauri/src/store/execution.rs")
          replace_once(
              execution_rs,
              '''const LEGACY_RUNTIME_IDENTITY: &str = "legacy-unverified";\nconst LEGACY_ADAPTER_IDENTITY: &str = "legacy-unverified";\nconst LEGACY_POLICY_IDENTITY: &str = "legacy-unverified";\nconst LEGACY_AMBIGUITY: &str =\n    "Legacy task activity had no authoritative Execution lifecycle or exact execution identity";\n\n''',
              "",
          )
          replace_once(
              execution_rs,
              '''        let started_at_ms = current\n            .started_at_ms\n            .or_else(|| (!matches!(next, ExecutionState::Queued)).then_some(timestamp));''',
              '''        let started_at_ms = current.started_at_ms.or_else(|| {\n            (!matches!(next, ExecutionState::Queued | ExecutionState::Cancelled))\n                .then_some(timestamp)\n        });''',
          )
          replace_once(
              execution_rs,
              '''               tasks.created_at_ms, NULL, NULL, tasks.updated_at_ms''',
              '''               tasks.created_at_ms, NULL, tasks.updated_at_ms, tasks.updated_at_ms''',
          )

          store_tests = Path("apps/desktop/src-tauri/tests/desktop_store.rs")
          text = store_tests.read_text(encoding="utf-8")
          marker = '''#[test]\nfn restart_interrupts_the_exact_execution_and_its_pending_approval() {'''
          if text.count(marker) != 1:
              raise SystemExit("restart test marker changed")
          insertion = '''#[test]\nfn queued_cancellation_does_not_invent_a_start_timestamp() {\n    let (_temporary, store, task_id) = setup();\n    let execution = store\n        .create_execution(CreateExecution {\n            task_id,\n            specification: specification('a'),\n        })\n        .unwrap();\n\n    let cancelled = store\n        .transition_execution(execution.id.as_str(), ExecutionState::Cancelled, None)\n        .unwrap();\n\n    assert_eq!(cancelled.started_at_ms, None);\n    assert!(cancelled.finished_at_ms.is_some());\n}\n\n'''
          text = text.replace(marker, insertion + marker, 1)
          legacy_marker = '''    assert!(execution.specification.legacy_unverified);\n'''
          if text.count(legacy_marker) != 1:
              raise SystemExit("legacy migration assertion marker changed")
          text = text.replace(
              legacy_marker,
              legacy_marker + '''    assert_eq!(execution.finished_at_ms, Some(3));\n''',
              1,
          )
          store_tests.write_text(text, encoding="utf-8")

          workspace_tests = Path("apps/desktop/src-tauri/tests/workspace.rs")
          replace_once(
              workspace_tests,
              '''use alpine_desktop::store::{CreateTask, DesktopStore, NewToolApproval};''',
              '''use alpine_desktop::store::{\n    CreateExecution, CreateTask, DesktopStore, ExecutionId, NewExecutionSpecification,\n    NewToolApproval,\n};''',
          )
          replace_once(
              workspace_tests,
              '''fn setup() -> (tempfile::TempDir, DesktopStore, String) {''',
              '''fn execution_specification() -> NewExecutionSpecification {\n    NewExecutionSpecification {\n        model_registry_id: "model-workspace".to_owned(),\n        model_repo_id: "Qwen/Qwen-GGUF".to_owned(),\n        model_revision: Some("a".repeat(40)),\n        model_filename: "model.gguf".to_owned(),\n        model_sha256: "b".repeat(64),\n        session_config_sha256: "c".repeat(64),\n        profile_name: "stable-16k".to_owned(),\n        profile_sha256: "d".repeat(64),\n        runtime_name: "official".to_owned(),\n        runtime_identity: "e".repeat(64),\n        adapter_identity: "pi-agent-core@0.84.2".to_owned(),\n        policy_identity: "alpine-desktop-project-tools-v1".to_owned(),\n        context_window: 16_384,\n        max_tokens: 2_048,\n        temperature_millis: 200,\n    }\n}\n\nfn setup() -> (tempfile::TempDir, DesktopStore, String, ExecutionId) {''',
          )
          replace_once(
              workspace_tests,
              '''    (temporary, store, task.id)\n}''',
              '''    let execution = store\n        .create_execution(CreateExecution {\n            task_id: task.id.clone(),\n            specification: execution_specification(),\n        })\n        .unwrap();\n    (temporary, store, task.id, execution.id)\n}''',
          )
          replace_once(
              workspace_tests,
              '''fn read_list_and_search_stay_inside_the_selected_project() {\n    let (_temporary, store, task_id) = setup();''',
              '''fn read_list_and_search_stay_inside_the_selected_project() {\n    let (_temporary, store, task_id, _execution_id) = setup();''',
          )
          replace_once(
              workspace_tests,
              '''fn an_exact_approved_edit_returns_a_reviewable_diff() {\n    let (temporary, store, task_id) = setup();''',
              '''fn an_exact_approved_edit_returns_a_reviewable_diff() {\n    let (temporary, store, task_id, execution_id) = setup();''',
          )
          replace_once(
              workspace_tests,
              '''fn an_exact_approved_shell_command_captures_output() {\n    let (_temporary, store, task_id) = setup();''',
              '''fn an_exact_approved_shell_command_captures_output() {\n    let (_temporary, store, task_id, execution_id) = setup();''',
          )
          text = workspace_tests.read_text(encoding="utf-8")
          approval_marker = '''            task_id: task_id.clone(),\n            tool_call_id:'''
          if text.count(approval_marker) != 2:
              raise SystemExit("expected two workspace approval constructors")
          workspace_tests.write_text(
              text.replace(
                  approval_marker,
                  '''            task_id: task_id.clone(),\n            execution_id: execution_id.clone(),\n            tool_call_id:''',
              ),
              encoding="utf-8",
          )

          task_execution = Path("apps/desktop/src/task-execution.ts")
          replace_once(
              task_execution,
              '''  private persistenceFailure: Error | null = null;\n  private cancelStatus: Promise<unknown> = Promise.resolve();''',
              '''  private persistenceFailure: Error | null = null;\n  private cancellationFailure: Error | null = null;\n  private cancelStatus: Promise<void> = Promise.resolve();''',
          )
          replace_once(
              task_execution,
              '''    this.cancelStatus = this.execution\n      ? this.moveTo("cancelling").catch((error: unknown) => {\n          this.input.onUpdate({\n            type: "error",\n            scope: "persistence",\n            message: `Cancellation state could not be saved: ${asError(error).message}`,\n          });\n        })\n      : Promise.resolve();\n  }\n\n  private async settleCancelled(): Promise<TaskExecutionResult> {\n    await this.cancelStatus;\n    if (this.execution && !isTerminal(this.execution.state)) {\n      await this.moveTo("cancelled").catch(() => undefined);\n    }\n    await this.recordMetricEvent("cancelled").catch(() => undefined);\n    this.flushResponse();\n    return this.result("cancelled");\n  }''',
              '''    this.cancelStatus = this.execution\n      ? this.moveTo("cancelling")\n          .then(() => undefined)\n          .catch((error: unknown) => {\n            this.cancellationFailure = new Error(\n              `Cancellation state could not be saved: ${asError(error).message}`,\n            );\n            this.input.onUpdate({\n              type: "error",\n              scope: "persistence",\n              message: this.cancellationFailure.message,\n            });\n          })\n      : Promise.resolve();\n  }\n\n  private async settleCancelled(): Promise<TaskExecutionResult> {\n    await this.cancelStatus;\n    if (this.cancellationFailure) {\n      const message = this.cancellationFailure.message;\n      if (this.execution && !isTerminal(this.execution.state)) {\n        await this.moveTo("failed", message).catch(() => undefined);\n      }\n      this.flushResponse();\n      return this.result("error", message);\n    }\n    if (this.execution && !isTerminal(this.execution.state)) {\n      try {\n        await this.moveTo("cancelled");\n      } catch (error) {\n        const message = `Cancellation state could not be saved: ${asError(error).message}`;\n        this.input.onUpdate({ type: "error", scope: "persistence", message });\n        await this.moveTo("failed", message).catch(() => undefined);\n        this.flushResponse();\n        return this.result("error", message);\n      }\n    }\n    await this.recordMetricEvent("cancelled").catch(() => undefined);\n    this.flushResponse();\n    return this.result("cancelled");\n  }''',
          )
          replace_once(
              task_execution,
              '''      if (isTerminal(this.execution.state)) return this.execution;''',
              '''      if (isTerminal(this.execution.state)) {\n        throw new Error(`Execution is already ${this.execution.state}`);\n      }''',
          )

          task_tests = Path("apps/desktop/src/task-execution.test.ts")
          text = task_tests.read_text(encoding="utf-8")
          marker = '''  it("fails a queued Execution when preparation persistence fails", async () => {'''
          if text.count(marker) != 1:
              raise SystemExit("queued failure test marker changed")
          insertion = '''  it("does not claim cancellation when its durable transition fails", async () => {\n    const desktop = desktopDouble();\n    let releaseLaunch!: (runtime: AgentRuntime) => void;\n    const runtimePromise = new Promise<AgentRuntime>((resolve) => {\n      releaseLaunch = resolve;\n    });\n    const createRuntime = vi.fn(() => runtimePromise);\n    const controller = createTaskExecution(\n      { desktop, task: task(), history: [], onUpdate: () => undefined },\n      {\n        createRuntime,\n        scheduleFrame: () => 1,\n        cancelFrame: () => undefined,\n      },\n    );\n\n    const run = controller.run("Wait for launch");\n    await vi.waitFor(() => expect(createRuntime).toHaveBeenCalled());\n    vi.mocked(desktop.transitionExecution).mockRejectedValueOnce(\n      new Error("state store unavailable"),\n    );\n    controller.cancel();\n    releaseLaunch(runtimeThatEmits([]));\n\n    await expect(run).resolves.toMatchObject({\n      executionId: "execution-1",\n      state: "error",\n      error: "Cancellation state could not be saved: state store unavailable",\n    });\n    expect(desktop.transitionExecution).toHaveBeenCalledWith(\n      "execution-1",\n      "cancelling",\n      null,\n    );\n    expect(desktop.transitionExecution).toHaveBeenCalledWith(\n      "execution-1",\n      "failed",\n      "Cancellation state could not be saved: state store unavailable",\n    );\n    expect(desktop.transitionExecution).not.toHaveBeenCalledWith(\n      "execution-1",\n      "cancelled",\n      null,\n    );\n  });\n\n'''
          task_tests.write_text(text.replace(marker, insertion + marker, 1), encoding="utf-8")
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Verify renderer lifecycle
        working-directory: apps/desktop
        run: |
          npm ci
          npm test
          npm run typecheck
      - name: Install desktop Rust
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - name: Warm Windows PowerShell
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -Command "exit 0"
      - name: Verify native Execution aggregate
        run: |
          cargo +1.88.0 fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
          cargo +1.88.0 clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings
          cargo +1.88.0 test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets --all-features
      - name: Commit verified invariant fixes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/store/execution.rs apps/desktop/src-tauri/tests/desktop_store.rs apps/desktop/src-tauri/tests/workspace.rs apps/desktop/src/task-execution.ts apps/desktop/src/task-execution.test.ts
          git commit -m "fix: preserve authoritative execution outcomes"
          git push origin HEAD:codex/issue-46-execution-aggregate
