name: canonical-verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: canonical-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-verification:
    name: canonical-verification
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: cmd
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
      - name: Verify DCO sign-offs for pull-request commits
        if: github.event_name == 'pull_request'
        run: cargo run --locked --bin alpine-verify -- dco "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Run canonical verification
        run: cargo run --locked --bin alpine-verify
