name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
      - name: Verify DCO sign-offs for pull-request commits
        if: github.event_name == 'pull_request'
        shell: powershell
        run: |
          $range = '${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}'
          $missing = @()
          foreach ($commit in @(git rev-list $range)) {
            $message = git show -s --format=%B $commit
            if (($message -join "`n") -notmatch '(?m)^Signed-off-by: .+ <[^>]+>$') {
              $missing += $commit
            }
          }
          if ($missing.Count -gt 0) {
            throw "DCO Signed-off-by trailer missing from: $($missing -join ', ')"
          }
      - name: Verify
        shell: powershell
        run: .\scripts\verify.ps1
