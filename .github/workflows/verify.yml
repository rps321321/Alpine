name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
      - name: Verify
        shell: powershell
        run: .\scripts\verify.ps1
