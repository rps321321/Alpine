name: project-management-validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: project-management-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  project-management-validation:
    name: project-management-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Compile policy tools
        run: >-
          python -m py_compile
          scripts/validate_repository_policy.py
          scripts/configure_github_repository.py
      - name: Validate repository policy
        run: python scripts/validate_repository_policy.py
